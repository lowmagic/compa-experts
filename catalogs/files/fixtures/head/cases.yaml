cases:
  - name: the first two lines
    params: {path: logs/app.log, lines: 2}
    output: |
      2026-03-01T10:01:00Z app[101]: request 1 served in 13 ms
      2026-03-01T10:02:00Z app[101]: request 2 served in 16 ms
  - name: no lines is not a count
    params: {path: logs/app.log, lines: 0}
    status: unavailable
    reason: below the minimum 1
  - name: a file outside the root is refused
    params: {path: ../outside}
    status: failed
    reason: escapes the artifact root
